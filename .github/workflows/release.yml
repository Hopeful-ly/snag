name: Release

# Builds the installers and test-installs each on a clean machine; a version tag also gets a
# draft GitHub release. Signing runs only when its secrets are set (docs/RELEASING.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One run per tag: GitHub sometimes delivers a tag's push twice.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Where the released Snag looks for its feed (docs/RELEASING.md).
  SNAG_FEED_URL: ${{ vars.SNAG_FEED_URL }}

jobs:
  # Windows too: Snag cross-builds without cgo, and NSIS and jsign both run on Linux.
  linux:
    name: Linux packages and Windows installer
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      WINDOWS_SIGNING: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the version comes from the latest tag

      - uses: ./.github/actions/setup
        with:
          apt: libgtk-4-dev libwebkitgtk-6.0-dev nsis

      # nfpm needs a newer Go than Snag; let Go fetch it for this one install.
      - name: Install nfpm
        run: GOTOOLCHAIN=auto go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: Install jsign
        if: env.WINDOWS_SIGNING == 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/jsign.jar" https://github.com/ebourg/jsign/releases/download/7.6/jsign-7.6.jar
          echo "6cf58aa080e7ff82656f320cff8d4a3bff30408df8766806dcba3740dd839fa5  $RUNNER_TEMP/jsign.jar" | sha256sum -c
          echo "JSIGN=$RUNNER_TEMP/jsign.jar" >> "$GITHUB_ENV"

      - run: task package:linux

      - name: Make the Windows installer, and sign it
        run: task package:windows
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}

      # Mozilla signs each version once, so only releases are sent to it.
      - name: Pack the extension, and sign it for Firefox
        run: task package:extension
        env:
          AMO_JWT_ISSUER: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.AMO_JWT_ISSUER || '' }}
          AMO_JWT_SECRET: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.AMO_JWT_SECRET || '' }}
          SNAG_FIREFOX_UPDATE_URL: ${{ vars.SNAG_FIREFOX_UPDATE_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: |
            dist/extension/*.zip
            dist/extension/*.xpi

  macos:
    name: macOS disk image
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      MACOS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
      MACOS_NOTARIZING: ${{ secrets.MACOS_CERT_P12 != '' && secrets.APPLE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # The Developer ID certificate goes into a keychain of its own, which only codesign may use.
      - name: Add the signing certificate
        if: env.MACOS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          # The keychains already searched, kept after ours: one path a line, none with spaces.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - run: task package:macos
        env:
          MACOS_SIGN_IDENTITY: ${{ env.MACOS_SIGNING == 'true' && vars.MACOS_SIGN_IDENTITY || '' }}

      - name: The app holds both architectures and is signed
        run: |
          lipo -archs dist/Snag.app/Contents/MacOS/snag | grep -q 'x86_64 arm64'
          codesign --verify --deep --strict dist/Snag.app
          hdiutil verify dist/Snag-*-macos.dmg

      - name: Notarize the disk image
        if: env.MACOS_NOTARIZING == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          key=$RUNNER_TEMP/AuthKey.p8
          printf '%s\n' "$APPLE_API_KEY" > "$key"
          auth=(--key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          dmg=$(ls dist/Snag-*-macos.dmg)
          result=$(xcrun notarytool submit "$dmg" "${auth[@]}" --wait --output-format json)
          echo "$result"
          if [ "$(jq -r .status <<< "$result")" != Accepted ]; then
            xcrun notarytool log "$(jq -r .id <<< "$result")" "${auth[@]}"
            exit 1
          fi
          xcrun stapler staple "$dmg"
          rm "$key"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  test-deb:
    name: Install the .deb
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: linux

      - name: Install
        run: sudo apt-get update && sudo apt-get install -y ./snag_*_amd64.deb

      - name: Check the installed files and browser setup
        run: |
          test -x /usr/lib/snag/snag-host
          test -x /usr/lib/snag/tools/yt-dlp
          test "$(readlink -f /usr/bin/snag)" = /usr/lib/snag/snag
          desktop-file-validate /usr/share/applications/snag.desktop || true
          # Snag sets up the browsers it finds, so give it one to find.
          mkdir -p ~/.config/chromium
          snag --register-browsers
          grep -q '"path": "/usr/lib/snag/snag-host"' ~/.config/chromium/NativeMessagingHosts/snag.host.json
          snag --unregister-browsers
          test ! -e ~/.config/chromium/NativeMessagingHosts/snag.host.json

      - name: Remove
        run: |
          sudo apt-get remove -y snag
          test ! -e /usr/lib/snag

  test-windows:
    name: Install on Windows
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: windows

      - name: Install, check, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem *-setup.exe).FullName
          Start-Process $setup -ArgumentList '/S' -Wait
          $dir = "$env:LOCALAPPDATA\Programs\Snag"
          foreach ($f in 'snag.exe', 'snag-host.exe', 'uninstall.exe', 'tools\yt-dlp.exe', 'tools\ffmpeg.exe') {
            if (-not (Test-Path "$dir\$f")) { throw "missing $f" }
          }
          $app = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Snag'
          if ($app.InstallLocation -ne $dir) { throw "installed at $($app.InstallLocation)" }
          $manifest = (Get-ItemProperty 'HKCU:\Software\Microsoft\Edge\NativeMessagingHosts\snag.host').'(default)'
          $hostPath = (Get-Content $manifest | ConvertFrom-Json).path
          if ($hostPath -ne "$dir\snag-host.exe") { throw "the browsers start $hostPath" }

          # The uninstaller copies itself to a temporary folder and returns at once; wait for it.
          Start-Process "$dir\uninstall.exe" -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\snag.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\snag.exe") { throw 'uninstall left snag.exe' }
          if (Test-Path 'HKCU:\Software\Microsoft\Edge\NativeMessagingHosts\snag.host') { throw 'uninstall left the browser setup' }

  release:
    name: Draft the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, test-deb, test-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: List checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Make a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes dist/*
