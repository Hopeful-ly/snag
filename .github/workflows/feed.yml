name: Feed

# Signs and publishes the update feed (internal/feed). Run by hand after publishing a release,
# or to hold yt-dlp at a version when a newer one breaks something.
on:
  workflow_dispatch:
    inputs:
      snag:
        description: The latest Snag (1.2.0); empty for the latest tag, or none before the first
        required: false
      ytdlp:
        description: The yt-dlp to use (2026.10.10, nightly@2026.10.20.232845); empty for its latest release
        required: false

permissions:
  contents: read

jobs:
  feed:
    name: Sign and publish the feed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # for the latest tag

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Sign the feed
        env:
          SNAG_FEED_KEY: ${{ secrets.SNAG_FEED_KEY }}
          SNAG: ${{ inputs.snag }}
          YTDLP: ${{ inputs.ytdlp }}
        run: |
          version=${SNAG:-$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)}
          version=${version#v}
          release=()
          if [ -n "$version" ]; then
            release=(-snag "$version" -page "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$version")
          else
            echo "::notice::No release yet: the feed names only the yt-dlp to use."
          fi
          go run ./cmd/sign-feed "${release[@]}" -ytdlp "$YTDLP" -o feed.json
          base64 -d <<< "$(jq -r .feed feed.json)" | jq .

      # Short caching, so a held-back yt-dlp reaches everyone within minutes.
      - name: Publish it
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          BUCKET: ${{ vars.FEED_BUCKET }}
        run: |
          if [ -z "$BUCKET" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::The feed's storage isn't set up (docs/RELEASING.md, Snag's feed)."
            exit 1
          fi
          aws s3 cp --no-progress --content-type application/json --cache-control max-age=300 \
            feed.json "s3://$BUCKET/feed.json"
