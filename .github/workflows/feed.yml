name: Feed

# Signs and publishes the update feed (internal/feed). Run by hand after publishing a release,
# or to hold yt-dlp at a version when a newer one breaks something.
on:
  workflow_dispatch:
    inputs:
      snag:
        description: The latest Snag (1.2.0); empty for the latest tag, or none before the first
        required: false
      ytdlp:
        description: The yt-dlp to use (2026.10.10, nightly@2026.10.20.232845); empty for its latest release
        required: false

permissions:
  contents: read

jobs:
  feed:
    name: Sign and publish the feed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # for the latest tag

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Sign the feed
        env:
          GH_TOKEN: ${{ github.token }}
          SNAG_FEED_KEY: ${{ secrets.SNAG_FEED_KEY }}
          SNAG: ${{ inputs.snag }}
          YTDLP: ${{ inputs.ytdlp }}
        run: |
          version=${SNAG:-$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)}
          version=${version#v}
          release=()
          if [ -n "$version" ]; then
            release=(-snag "$version" -page "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$version")
            # The installers' checksums, for Snag to update itself.
            gh release download "v$version" --pattern SHA256SUMS --dir release
            release+=(-sums release/SHA256SUMS -download "https://github.com/$GITHUB_REPOSITORY/releases/download/v$version")
          else
            echo "::notice::No release yet: the feed names only the yt-dlp to use."
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          go run ./cmd/sign-feed "${release[@]}" -ytdlp "$YTDLP" -o feed.json
          base64 -d <<< "$(jq -r .feed feed.json)" | jq .

      # Short caching, so a held-back yt-dlp reaches everyone within minutes.
      - name: Publish it
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          BUCKET: ${{ vars.FEED_BUCKET }}
        run: |
          if [ -z "$BUCKET" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::The feed's storage isn't set up (docs/RELEASING.md, Snag's feed)."
            exit 1
          fi
          aws s3 cp --no-progress --content-type application/json --cache-control max-age=300 \
            feed.json "s3://$BUCKET/feed.json"

      # Firefox offers to install an add-on from a link only when it's served as
      # application/x-xpinstall, which GitHub's release downloads aren't. snag.xpi is always the
      # latest; updates.json is where installed copies look for newer ones (their update_url).
      - name: Publish the Firefox add-on
        if: env.VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          BUCKET: ${{ vars.FEED_BUCKET }}
          FEED_URL: ${{ vars.SNAG_FEED_URL }}
        run: |
          xpi="snag-firefox-$VERSION.xpi"
          if ! gh release download "v$VERSION" --pattern "$xpi" --dir firefox; then
            echo "::notice::v$VERSION has no signed Firefox add-on."
            exit 0
          fi
          base="${FEED_URL%/*}/firefox"
          id=$(jq -r .browser_specific_settings.gecko.id extension/manifests/firefox.json)
          hash=$(sha256sum "firefox/$xpi" | cut -d' ' -f1)
          jq -n --arg id "$id" --arg v "$VERSION" --arg link "$base/$xpi" --arg hash "sha256:$hash" \
            '{addons: {($id): {updates: [{version: $v, update_link: $link, update_hash: $hash}]}}}' \
            > firefox/updates.json
          cat firefox/updates.json
          aws s3 cp --no-progress --content-type application/x-xpinstall \
            "firefox/$xpi" "s3://$BUCKET/firefox/$xpi"
          aws s3 cp --no-progress --content-type application/x-xpinstall --cache-control max-age=300 \
            "firefox/$xpi" "s3://$BUCKET/firefox/snag.xpi"
          aws s3 cp --no-progress --content-type application/json --cache-control max-age=300 \
            firefox/updates.json "s3://$BUCKET/firefox/updates.json"
