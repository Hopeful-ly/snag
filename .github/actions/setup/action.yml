name: Set up
description: Go, Node, Task, the Wails CLI and the project's packages, ready to build Snag

inputs:
  apt:
    description: Packages to install on Linux
    default: libgtk-4-dev libwebkitgtk-6.0-dev

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          frontend/package-lock.json
          extension/package-lock.json

    - name: Install Linux libraries
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ${{ inputs.apt }}

    - uses: go-task/setup-task@v1
      with:
        version: 3.x

    - name: Install the Wails CLI
      shell: bash
      run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28

    - shell: bash
      run: task setup
