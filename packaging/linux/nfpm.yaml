# From a release build in dist/linux:
#   VERSION=1.2.0 ARCH=amd64 nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/
# The app sets up the browsers per user on start; FFmpeg comes from the system.
name: snag
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
# Set a real contact (and homepage) before publishing packages.
maintainer: Snag
description: |
  Download manager with a one-click Download button on web videos: every quality, proper
  names, fast resumable multi-connection downloads, and a desktop app with tray.
license: Proprietary
homepage: https://github.com/Roham1299/snag

contents:
  - src: dist/linux/snag
    dst: /usr/lib/snag/snag
    file_info: { mode: 0755 }
  - src: dist/linux/snag-host
    dst: /usr/lib/snag/snag-host
    file_info: { mode: 0755 }
  - src: dist/linux/tools/yt-dlp
    dst: /usr/lib/snag/tools/yt-dlp
    file_info: { mode: 0755 }
  - src: /usr/lib/snag/snag
    dst: /usr/bin/snag
    type: symlink
  - src: packaging/linux/snag.desktop
    dst: /usr/share/applications/snag.desktop
  - src: packaging/icons/snag.svg
    dst: /usr/share/icons/hicolor/scalable/apps/snag.svg
  - src: packaging/icons/snag.svg
    dst: /usr/share/icons/hicolor/scalable/apps/app.snag.desktop.svg
  - src: packaging/icons/snag-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/snag.png
  - src: packaging/icons/snag-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/app.snag.desktop.png
  - src: packaging/icons/snag-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/snag.png

overrides:
  deb:
    depends: [libgtk-4-1, libwebkitgtk-6.0-4, ffmpeg]
  rpm:
    depends: [gtk4, webkitgtk6.0, ffmpeg-free]
  archlinux:
    depends: [gtk4, webkitgtk-6.0, ffmpeg]
